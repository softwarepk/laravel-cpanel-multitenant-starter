name: tests

# Manual by default so this starter does not consume Actions minutes simply by being cloned.
# Projects may add push/pull_request triggers once CI capacity and branch rules are configured.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup application
        run: composer setup

      - name: Run quality gate
        run: composer ci:check
